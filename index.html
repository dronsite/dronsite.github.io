    <style>
        @font-face {
            font-family: 'SF Pro';
            src: local('SF Pro'), local('-apple-system'), local('BlinkMacSystemFont');
            /* неужели подглядывать в css это настолько интересно? */
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'ZT Neue Relewe';
            src: url('https://dronsite.github.io/ZTNeueRalewe-Regular.woff2') format('woff2'),
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- ФОНОВЫЕ КАРТИНКИ ПО УГЛАМ (ЭЛЕМЕНТЫ) --- */
        .collage-img {
            position: absolute;
            z-index: 1;
            object-fit: contain;
            pointer-events: none;
        }

        .img-keyboard-statue {
            top: 0;
            left: 0;
            width: 600px;
            max-width: 600px;
        }

        .img-sketch-watch {
            top: 0;
            right: 0;
            width: 600px;
            max-width: 650px;
        }


        .img-letter {
            bottom: 0;
            left: 0;
            width: 550px;
            max-width: 600px;
        }


        .img-pillow-cig {
            bottom: 0;
            right: 0;
            width: 850px;
            max-width: 850px;
        }

        /* --- вот эта хрень сверху --- */
        .top-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'ZT Neue Relewe', 'Playfair Display', serif;
            font-size: 2.3rem; /* тут ты ничего больше не найдёшь, bro */
            color: #111111;
            z-index: 10;
            text-align: center;
        }

        ::selection {
            color: #ffffff;
            background: #000;
        }

        .center-content {
            display: flex;
            width: 85%;
            max-width: 1400px;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .left-col {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50%;
        }

        .menu-box {
            border: 1px solid #555;
            border-radius: 12px;
            padding: 20px 40px;
            background: #ffffff;
            text-align: left;
            width: 85%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .menu-item {
            font-size: 1.8rem;
            line-height: 2;
            font-weight: 400;
            text-transform: lowercase;
        }

        .menu-item a {
            text-decoration: none;
            color: #111;
            transition: opacity 0.3s;
        }

        .menu-item a:hover {
            color: #8A2BE2;
        }

        .right-col {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 50%;
            padding-right: 2%;
        }

        .right-slogan {
            font-family: 'ZT Neue Relewe', 'Playfair Display', serif;
            font-size: 2.4rem;
            line-height: 1.2;
            text-align: right;
            color: #111;
            letter-spacing: -0.5px;
            white-space: nowrap; /* Строго в одну строку на ПК */
        }

        .bottom-text {
            position: absolute;
            bottom: 40px;
            text-align: center;
            z-index: 10;
            font-family: 'ZT Neue Relewe', 'Playfair Display', serif;
            font-size: 0.9rem;
            color: #333;
            width: 100%;
            line-height: 1.6;
        }

        .email {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
            margin-top: 4px;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .email:hover {
            border-bottom: 1px #000000;
        }

        .email a {
            text-decoration: none;
            color: #000;
        }

        .email a:hover {
            border-bottom: 1px #000000;
        }

        /* --- адаптивность --- */
        @media screen and (max-width: 768px) {
            /* На мобилах скрываем картинки */
            .collage-img {
                display: none;
            }

            .center-content {
                flex-direction: column;
                width: 90%;
                gap: 40px;
                margin-top: 60px;
            }

            .left-col, .right-col {
                width: 100%;
                justify-content: center;
            }

            .menu-box {
                text-align: center;
                padding: 25px 30px;
                width: 100%;
                max-width: 320px;
            }

            .right-col {
                padding-right: 0;
                justify-content: center;
            }

            .right-slogan {
                white-space: normal;
                text-align: center;
                font-size: 1.8rem;
                max-width: 100%;
            }

            .top-text {
                top: 20px;
                font-size: 1.8rem;
            }

            .bottom-text {
                bottom: 15px;
                font-size: 0.8rem;
                padding: 0 10px;
            }
            
            .email {
                font-size: 1rem;
            }
        }
    </style>
